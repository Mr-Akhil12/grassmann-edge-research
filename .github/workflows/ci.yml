name: Reproducible CPU research checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-parity-and-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Run operator, causality and cache parity tests
        run: python -m pytest -q
      - name: Repeat small controlled synthetic check
        run: python -m scripts.controlled_synthetic --device cpu --steps 12 --seeds 11,17 --lag 4 --out results/controlled_ci.json
      - name: Repeat small CPU prefill/cached-decode profile
        run: python -m scripts.benchmark_p2 --device cpu --lengths 16,32 --warmups 1 --repeats 3 --out results/p2_ci.json
      - name: Upload raw engineering checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-research-${{ matrix.os }}
          path: |
            results/controlled_ci.json
            results/p2_ci.json
          if-no-files-found: warn
